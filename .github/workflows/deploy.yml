name: Deploy ASP.NET Web API to Monster ASP

on:
  push:
    branches:
      - master  # Trigger deployment on push to the main branch

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '9.0'  # Replace with your .NET version

    - name: Restore dependencies
      run: dotnet restore

    - name: Build the project
      run: dotnet build --configuration Release

    - name: Publish the project
      run: dotnet publish --configuration Release --output ./publish

    - name: Deploy to Monster ASP
      uses: actions/upload-artifact@v4  # Updated to v4
      with:
        name: publish-output
        path: ./publish

    - name: Deploy using Publish Profile
      env:
        PUBLISH_PROFILE: ${{ secrets.PUBLISH_PROFILE }}
      run: |
        # Save the publish profile to a file
        echo "$PUBLISH_PROFILE" > publishprofile.publishsettings

        # Use MSDeploy to deploy the application
        "C:\Program Files (x86)\IIS\Microsoft Web Deploy V3\msdeploy.exe" -verb:sync -source:contentPath='./publish' -dest:contentPath='site14114',publishSettings='publishprofile.publishsettings'