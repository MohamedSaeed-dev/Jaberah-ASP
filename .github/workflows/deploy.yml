name: Deploy ASP.NET Web API to IIS Server

on:
  push:
    branches:
      - master  # Adjust based on your branch

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0'  # Adjust to your .NET version

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Publish application
        run: dotnet publish -c Release -o ./publish

      - name: Deploy to IIS via Web Deploy
        run: |
          $publishProfile = "${{ secrets.PUBLISH_PROFILE }}"
          $publishPath = "./publish"
          dotnet msdeploy --source:package="$publishPath" --dest:auto,computerName="site14114.siteasp.net",userName="site14114",password="C#d8=p4X7+Tg"
