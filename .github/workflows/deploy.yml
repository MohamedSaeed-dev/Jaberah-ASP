name: Deploy ASP.NET Web API to Monster ASP

on:
  push:
    branches:
      - master  # Trigger deployment on push to the main branch

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '9.0'  # Replace with your .NET version

    - name: Restore dependencies
      run: dotnet restore

    - name: Build the project
      run: dotnet build --configuration Release

    - name: Publish to folder
      run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --no-build --output ./publish

    - name: Deploy to Monster ASP via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
          server: ${{ SFTP_HOST }} # Replace with Monster ASP's FTP server
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /site14114/