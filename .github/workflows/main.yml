name: Build, publish and deploy to MonsterASP.NET

on:
  push:
    branches:
      - master
      - main-v2

jobs:
  build_and_deploy:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # قبل النشر لا بعده: اختبار فاشل يجب أن يوقف الخط قبل بناء حزمة النشر.
      - name: Test with .NET
        run: dotnet test --configuration Release --no-build

      # مشروع الويب صراحةً: نشر الحل كاملًا يجمع مخرجات كل المشاريع في مجلد واحد.
      - name: Publish
        run: dotnet publish Jaberah/Jaberah.csproj --configuration Release --output ./publish --runtime win-x86

      # Deploy for MASTER (Server 1)
      - name: Deploy to MonsterASP.NET (Server 1)
        if: github.ref == 'refs/heads/master'
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}

      # Deploy for MAIN-V2 (Server 2)
      - name: Deploy to MonsterASP.NET (Server 2)
        if: github.ref == 'refs/heads/main-v2'
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME_V2 }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME_V2 }}
          server-username: ${{ secrets.SERVER_USERNAME_V2 }}
          server-password: ${{ secrets.SERVER_PASSWORD_V2 }}